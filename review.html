<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBSE Class 10 Social Science – Answer Review</title>

<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f4f6}
header{background:#0f172a;color:#fff;padding:15px;text-align:center}
.container{padding:20px}
.qblock{background:#fff;margin-bottom:25px;padding:15px;border-radius:8px}
.qtitle{font-weight:bold;margin-bottom:10px}
.compare{display:flex;gap:20px}
.box{flex:1;border:1px solid #cbd5e1;padding:10px;border-radius:6px}
.student{background:#f0f9ff}
.model{background:#f0fdf4}
h4{margin-top:0}
.footer{text-align:center;color:#475569;margin:30px 0}
</style>
</head>

<body>

<header>
<h1>CBSE Class X – Social Science</h1>
<p>Answer Review (Student Response vs Model Answer)</p>
</header>

<div class="container" id="content"></div>

<div class="footer">
<p>Use this page for self-evaluation and improvement.</p>
</div>

<script>
const data = JSON.parse(localStorage.getItem("sst_response")) || {};
const container = document.getElementById("content");

/* ================= MODEL ANSWERS (Q1–Q38) ================= */

const model = {
1:"Growth of print culture.",
2:"Both A and R are true and R explains A.",
3:"Giuseppe Mazzini.",
4:"Chauri Chaura incident.",
5:"Truth and non-violence.",
6:"It was withdrawn after the violent Chauri Chaura incident which violated non-violence.",
7:"It led to price rise, forced recruitment and shortage of essential goods.",
8:"Cultural symbols created unity, pride and a shared sense of identity among people.",
9:"Dandi; Madras.",
10:"Black soil.",
11:"Both A and R are true and R explains A.",
12:"Solar energy.",
13:"Intensive subsistence farming.",
14:"Iron and steel industry.",
15:"Arid soils are sandy and lack humus and moisture.",
16:"They cause displacement, ecological imbalance and affect river ecology.",
17:"Availability of raw materials, power and transport facilities.",
18:"Air pollution; it reduces oxygen level in water harming aquatic life; strict pollution control.",
19:"Bhakra Nangal; Mumbai; Tarapur.",
20:"Horizontal power sharing.",
21:"Federalism.",
22:"Rule of law.",
23:"Election Commission of India.",
24:"A constituency reserved for SCs or STs to ensure their representation.",
25:"Lack of internal democracy and dynastic politics.",
26:"It strengthens democracy by promoting people’s participation at local levels.",
27:"They contest elections, form governments and shape public opinion.",
28:"Elections allow choice of representatives and ensure accountability of rulers.",
29:"Literacy rate.",
30:"Tertiary sector.",
31:"NABARD.",
32:"Bank employee.",
33:"Disguised unemployment occurs when more people work than required.",
34:"It does not show income distribution and quality of life.",
35:"Medium of exchange, store of value and unit of account.",
36:"SHGs promote savings, credit access and women empowerment.",
37:"Credit supports investment; debt trap occurs when loans cannot be repaid; banks and cooperatives.",
38:"By checking MRP and demanding bills."
};

/* ================= RENDER REVIEW ================= */

for(let i=1;i<=38;i++){
  let div=document.createElement("div");
  div.className="qblock";
  div.innerHTML=`
    <div class="qtitle">Q${i}</div>
    <div class="compare">
      <div class="box student">
        <h4>Your Answer</h4>
        <p>${data["q"+i] ? data["q"+i] : "Not Attempted"}</p>
      </div>
      <div class="box model">
        <h4>Model Answer</h4>
        <p>${model[i]}</p>
      </div>
    </div>
  `;
  container.appendChild(div);
}
</script>

</body>
</html>
